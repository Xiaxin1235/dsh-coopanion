<!doctype html><meta charset="utf-8"><title>Historical tail study · superseded</title>
<style>body{margin:0;background:white;color:#29374c;font:20px/1.4 Arial,sans-serif;width:1600px;text-align:center}h1{font-size:24px;margin:20px 0 24px}.views{display:grid;font-weight:bold}.diagram{position:relative}.label{position:absolute;font-weight:bold;padding-top:10px}canvas{display:block}p{margin:12px}small{font-size:16px}#metrics{font-size:16px;font-weight:normal}</style>
<h1>历史几何研究 · 尺寸方案已作废</h1><p><small>仅用于复现代理模型的投影与遮挡。现行角色以用户最新单人参考为准。<a href="index.html">返回现行参考与候选</a></small></p>
<div class="diagram"><canvas id="geometry" width="1600" height="840"></canvas><div id="labels"></div></div><div class="views" id="metrics"></div>
<p id="dimensions"></p>
<p id="camera"></p>
<p><small>Construction reference only. Do not copy mannequin or polygonal style into character artwork.</small></p>
<script type="module">import{drawDiagram}from'./tail-geometry.js';const version=new URLSearchParams(location.search).get('version')==='1'?1:2;const spec=await(await fetch('./source/tail-proportion-v'+version+'.json')).json(),columns=spec.layout?.columns??4,rows=Math.ceil(spec.views.length/columns),canvas=document.getElementById('geometry');canvas.height=420*rows;const metrics=drawDiagram(canvas,spec);document.getElementById('labels').replaceChildren(...spec.views.map((view,i)=>{const label=document.createElement('div');label.className='label';label.textContent=view.label;Object.assign(label.style,{left:(i%columns)*100/columns+'%',top:Math.floor(i/columns)*420+'px',width:100/columns+'%'});return label;}));document.getElementById('metrics').style.gridTemplateColumns='repeat('+columns+',1fr)';document.getElementById('metrics').replaceChildren(...metrics.map(m=>{const span=document.createElement('span');span.textContent='Whole-tail projected width: '+m.projectedWidth.toFixed(3)+' S';return span;}));document.getElementById('dimensions').textContent='S = maximum skirt hem width. Fixed fluke span = '+spec.flukeSpan+' S.';document.getElementById('camera').textContent='Grey mannequin occludes the tail. Root hidden inside skirt. Fixed '+spec.projection.elevationDegrees+'° camera elevation.';window.tailGeometry={spec,metrics};</script>
