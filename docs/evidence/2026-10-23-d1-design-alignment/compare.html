<h1>设计与实际身体对照</h1><p>2026-10-23 · 设计与实际网格按相同脚底和全身高度排列。右列是修订后 WebGL 身体的中性帧。</p>
<label>右列叠加透明度 <input id="opacity" type="range" min="0" max="100" value="100"><output id="value">100%</output></label><small>100% 为新身体；50% 与设计叠加；0% 为设计。遮脸与去尾钩按此前反馈保留。</small>
<h2>正面</h2><section>
<figure><figcaption>用户设计</figcaption><div class="frame"><img src="design-front.png" alt="正面设计"></div></figure>
<figure><figcaption>修订前实际身体</figcaption><div class="frame"><img src="baseline-front.png" alt="旧正面网格"></div></figure>
<figure><figcaption>修订后实际身体</figcaption><div class="frame current"><img src="design-front.png" alt="正面设计底图"><img src="final-authoring/front.png" alt="新正面网格"></div></figure>
</section><h2>右斜后</h2><section>
<figure><figcaption>用户设计</figcaption><div class="frame"><img src="design-backRight.png" alt="斜后设计"></div></figure>
<figure><figcaption>修订前实际身体</figcaption><div class="frame"><img src="baseline-backRight.png" alt="旧斜后网格"></div></figure>
<figure><figcaption>修订后实际身体</figcaption><div class="frame current"><img src="design-backRight.png" alt="斜后设计底图"><img src="final-authoring/backRight.png" alt="新斜后网格"></div></figure>
</section>
<p>本页是提交 <code>50bcfec</code> 的固定画面对照。分层补画、复用的五官与蓝金结仍有细节差异，不能当作逐像素复制或用户已验收。</p>

<script>const slider=document.querySelector('#opacity'),value=document.querySelector('#value');slider.addEventListener('input',()=>{document.documentElement.style.setProperty('--opacity',slider.value/100);value.textContent=slider.value+'%';});</script></html>
