name: Setup pinned Node and npm
description: Use the repository Node baseline and an isolated pinned npm CLI.
inputs:
  cache:
    description: npm for development checks, empty for releases.
    required: false
    default: npm
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache }}
        package-manager-cache: false
    - name: Install pinned npm without changing the global installation
      shell: bash
      run: |
        npm_spec=$(node -e 'const p=require("./package.json");if(!/^npm@\d+\.\d+\.\d+$/.test(p.packageManager))throw Error("packageManager must pin npm");process.stdout.write(p.packageManager)')
        npm install --prefix "$RUNNER_TEMP/coopanion-npm" --ignore-scripts --no-package-lock --no-audit --no-fund "$npm_spec"
        echo "$RUNNER_TEMP/coopanion-npm/node_modules/.bin" >> "$GITHUB_PATH"
    - shell: bash
      run: |
        node --version
        npm --version
