name: WhaleMaid companion release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Xiaxin1235/dsh-coopanion'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/whaledot-local
          git checkout --detach "$commit"
          test "v$(node -p 'require("./package.json").version')" = "$TAG"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify.outputs.commit }}
      release-tag: ${{ needs.verify.outputs.tag }}
  publish:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-pet
          path: release
      - name: Verify and publish the same tested package to the fork only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          node scripts/check-package.mjs "release/dsh-coopanion-${TAG#v}.tgz" --report release/verification.json --expected-commit "$COMMIT" --expected-version "${TAG#v}"
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "WhaleMaid companion ${TAG#v}" --notes-file release/release-notes.md
