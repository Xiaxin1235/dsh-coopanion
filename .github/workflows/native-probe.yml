name: Targeted native recovery
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to inspect
        type: choice
        default: all
        options: [all, linux, macos]
      suite:
        description: Native recovery or the release failures under investigation
        type: choice
        default: recovery
        options: [recovery, release-regressions]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-latest"]' || inputs.platform == 'macos' && '["macos-14"]' || '["ubuntu-latest","macos-14"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: npm ci --ignore-scripts
      - run: npm run setup:electron
      - run: npm run build
      - uses: ./.github/actions/setup-linux-display
        if: runner.os == 'Linux'
      - run: npx playwright-core install --with-deps chromium
        if: inputs.suite == 'release-regressions'
      - run: npm run character:pack -- examples/star paper-star.zip
        if: inputs.suite == 'release-regressions'
      - run: node tests/window-recovery-probe.mjs
        if: inputs.suite != 'release-regressions'
      - run: node tests/multi-display-native.mjs
        if: runner.os == 'Linux' && inputs.suite != 'release-regressions'
      - run: npm run test:ui
        if: runner.os == 'macOS' && inputs.suite == 'release-regressions'
      - run: npm run test:desktop
        if: runner.os == 'Linux' && inputs.suite == 'release-regressions'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-native-${{ runner.os }}
          path: artifacts/
