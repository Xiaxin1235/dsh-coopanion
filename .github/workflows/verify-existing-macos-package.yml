name: Verify existing canonical package on macOS 15
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable product tag
        required: true
        type: string
      canonical-run:
        description: Workflow run containing the existing desktop-pet artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.1-alpha.1']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: ''
      - run: npm ci --ignore-scripts
      - run: npm run verify:metadata
      - run: npx playwright-core install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: desktop-pet
          path: release
          run-id: ${{ inputs.canonical-run }}
          github-token: ${{ github.token }}
      - name: Verify the existing package identity and real host installation
        env:
          DSH_TEST_VERSION: ${{ matrix.dsh }}
          DSH_TEST_PACKAGE_DIR: ${{ github.workspace }}/release
        shell: bash
        run: |
          cd release
          shasum -a 256 --check SHA256SUMS
          cd ..
          commit=$(git rev-parse HEAD)
          version=$(node -p 'require("./package.json").version')
          node scripts/check-package.mjs "release/dsh-coopanion-$version.tgz" --report release/verification.json --expected-commit "$commit" --expected-version "$version"
          npm run test:install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-macOS15-${{ matrix.dsh }}
          path: artifacts/
          retention-days: 7
