name: Targeted installed host
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to inspect
        type: choice
        default: all
        options: [all, windows, linux, macos]
      dsh:
        description: Advertised host version to inspect
        type: choice
        default: '0.2.1-rc.3'
        options: ['0.2.0-rc.2', '0.2.1-alpha.1', '0.2.1-rc.1', '0.2.1-rc.2', '0.2.1-rc.3']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack this committed candidate
        shell: bash
        run: |
          mkdir -p .cache/probe
          packed=$(npm pack --ignore-scripts --silent --pack-destination .cache/probe)
          version=$(node -p 'require("./package.json").version')
          mv ".cache/probe/$packed" ".cache/probe/dsh-coopanion-$version.tgz"
          node scripts/check-package.mjs ".cache/probe/dsh-coopanion-$version.tgz" --write-report
          npm run character:pack -- examples/star .cache/probe/paper-star.zip
      - uses: actions/upload-artifact@v4
        with:
          name: installed-host-candidate
          path: .cache/probe/
          include-hidden-files: true
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'linux' && '["ubuntu-latest"]' || inputs.platform == 'macos' && '["macos-15"]' || '["windows-latest","ubuntu-latest","macos-15"]') }}
        dsh: ['${{ inputs.dsh }}']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/setup-linux-display
        if: runner.os == 'Linux'
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/setup-ci-browser.mjs
        if: runner.os == 'macOS'
      - uses: actions/download-artifact@v4
        with:
          name: installed-host-candidate
          path: release
      - run: npm run test:install
        env:
          DSH_TEST_VERSION: ${{ matrix.dsh }}
          DSH_TEST_PACKAGE_DIR: ${{ github.workspace }}/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-host-${{ runner.os }}-${{ matrix.dsh }}
          path: artifacts/
