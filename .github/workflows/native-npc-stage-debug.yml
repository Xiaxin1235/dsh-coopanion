name: Native NPC stage diagnosis

on:
  push:
    branches: [codex/native-npc-stage-debug]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        port: [fixed, random]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: ''
      - run: npm ci --ignore-scripts
      - run: npm run setup:electron
      - run: npm run build
      - run: npm run character:pack -- examples/star paper-star.zip
      - name: Repeat the crash recovery to NPC handoff
        timeout-minutes: 7
        env:
          DEBUG: pw:browser
          ELECTRON_ENABLE_LOGGING: '1'
          DSH_DIAG_FRESH_NPC_PORT: ${{ matrix.port == 'random' && '1' || '0' }}
        run: |
          for attempt in 1 2; do
            node tests/native-npc-recovery-probe.mjs
            mkdir -p "artifacts/recovery-$attempt"
            cp artifacts/desktop-recovery.json artifacts/npc-life-native.json artifacts/npc-life-native-home.png "artifacts/recovery-$attempt/"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-npc-stage-diagnosis-${{ matrix.port }}
          path: artifacts/
          retention-days: 7
