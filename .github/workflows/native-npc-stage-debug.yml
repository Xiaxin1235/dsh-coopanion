name: Native NPC stage diagnosis

on:
  push:
    branches: [codex/native-npc-stage-debug]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        display: [idle-allowed, awake]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          cache: ''
      - run: npm ci --ignore-scripts
      - run: npm run setup:electron
      - run: npm run build
      - run: npm run character:pack -- examples/star paper-star.zip
      - run: npx playwright-core install --with-deps chromium
      - name: Record managed display policy
        run: pmset -g custom
      - name: Hold the managed display awake for the controlled case
        if: matrix.display == 'awake'
        run: caffeinate -d -t 1200 > "$RUNNER_TEMP/caffeinate.log" 2>&1 &
      - run: pmset -g assertions
      - run: npm run test:ui
      - run: npm run test:notification-ui
      - run: npm run test:inbox-ui
      - run: npm run test:keyboard-native
      - name: Trace the complete native sequence after the browser prelude
        timeout-minutes: 6
        env:
          DEBUG: pw:browser
          ELECTRON_ENABLE_LOGGING: '1'
        run: node tests/native-npc-recovery-probe.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-npc-stage-diagnosis-${{ matrix.display }}
          path: artifacts/
          retention-days: 7
